<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="game.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">
    <div class="container py-5 text-center">
        <h1 class="mb-4 text-primary">Tic-Tac-Toe</h1>

        <div class="d-flex justify-content-center">
            <div class="game-container">
            
                <div class="row">
                    <button class="cell btn btn-outline-primary" id="cell-0"></button>
                    <button class="cell btn btn-outline-primary" id="cell-1"></button>
                    <button class="cell btn btn-outline-primary" id="cell-2"></button>
                </div>
                <div class="row">
                    <button class="cell btn btn-outline-primary" id="cell-3"></button>
                    <button class="cell btn btn-outline-primary" id="cell-4"></button>
                    <button class="cell btn btn-outline-primary" id="cell-5"></button>
                </div>
                <div class="row">
                    <button class="cell btn btn-outline-primary" id="cell-6"></button>
                    <button class="cell btn btn-outline-primary" id="cell-7"></button>
                    <button class="cell btn btn-outline-primary" id="cell-8"></button>
                </div>
            </div>
        </div>

        <div id="result" class="mt-4 fs-4 fw-bold text-success"></div>
        <button id="restartBtn" class="btn btn-primary mt-3">Restart Game</button>
        <div class="scoreboard">
            <span>X Wins: <span id="scoreX">0</span></span>
            <span>O Wins: <span id="scoreO">0</span></span>
        </div>
        
    </div>

    <script src="game.js"></script>
</body>
</html>
